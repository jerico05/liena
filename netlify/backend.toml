# Site Netlify 2 — Backend (API Express + vues @liena/mobile / Yeria)
# Dans Netlify : Site configuration → Build → « Configuration file » = netlify/backend.toml
# Pas d’admin ici : URL Yeria = racine de CE site (PUBLIC_API_URL)

[build]
  # npm install (pas npm ci) : le lockfile généré sous Windows n’inclut pas toujours les
  # optionalDependencies Linux (@esbuild/*, @img/sharp-*) exigées par npm ci sur Netlify.
  command = "npm install && npm run db:generate && npm run build:mobile && npm run build:api"
  publish = "public/netlify-backend"

[build.environment]
  DATABASE_URL_UNPOOLED = "postgresql://build:build@127.0.0.1:5432/build"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "@prisma/adapter-pg", "pg", "sharp"]
  included_files = [
    "apps/api/dist/**",
    "apps/api/assets/**",
    "apps/mobile/dist/**",
    "packages/shared-schemas/dist/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/**",
    "prisma/**",
  ]

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/screens/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

