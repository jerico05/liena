# Site Netlify — Console admin (SPA uniquement)
# Configuration file = netlify/admin.toml (pas backend.toml)
# Variables de BUILD : VITE_API_URL uniquement (voir docs/deploy/admin-netlify.md)

[build]
  command = "npm run build:netlify-admin"
  publish = "apps/admin/dist"

[build.environment]
  NODE_VERSION = "22"
  # Définir dans l’UI : VITE_API_URL = https://VOTRE-BACKEND.netlify.app/api/v1

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200