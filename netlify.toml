# ⚠️ Site ADMIN uniquement. Pour l’API / Yeria : Configuration file = netlify/backend.toml
# (sinon Netlify prend ce fichier par défaut et lance build:admin — pas l’API).
# Voir docs/deploy/netlify-deux-sites.md

[build]
  command = "npm ci --include=optional && npm run build:admin"
  publish = "apps/admin/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200