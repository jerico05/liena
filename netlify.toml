[build]
  command = "npm run db:generate && npm run build"
  publish = "apps/admin/dist"

[build.environment]
  DATABASE_URL_UNPOOLED = "postgresql://build:build@127.0.0.1:5432/build"
  VITE_API_URL = "/api/v1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "@prisma/adapter-pg", "pg"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
