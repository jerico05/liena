# Déploiement Netlify en 2 sites — voir netlify/admin.toml et netlify/backend.toml
#
# Site admin déjà existant : passer ce fichier à l’équivalent admin
# (Build → Configuration file = netlify/admin.toml)
#
# Ce fichier racine = alias admin pour compatibilité (même contenu simplifié).

[build]
  command = "npm ci && npm run build:admin"
  publish = "apps/admin/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200